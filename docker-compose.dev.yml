# BUILD LOCAL

version: "3.9"

services:
  backend:
    # -- easiest path: reuse the published image and start it “API-only”
    image: langflowai/langflow:latest
    command: >
      python -m langflow run
      --host 0.0.0.0
      --port 7860
      --backend-only
    environment:
      # tell Langflow where Postgres lives
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@postgres:5432/langflow
      LANGFLOW_CORS_ORIGINS: "*"
    depends_on: [postgres]
    ports:
      - "7860:7860"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:  langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB:  langflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"

volumes:
  postgres-data:


